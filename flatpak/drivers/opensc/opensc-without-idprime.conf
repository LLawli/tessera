# OpenSC's configuration in Tessera while SafeNet's driver is on too (see
# driver.toml): every card driver of OpenSC 0.27 (src/libopensc/ctx.c,
# internal_card_drivers, in the same order) except idprime, whose cards
# (IDPrime, eToken 5110) SafeNet's driver serves. Update this list with
# OpenSC.
app default {
	# GD Burti's tokens (G+D StarSign CUT S): OpenSC has no driver for them,
	# and its probing (selects and status polls) leaves the token hung, for
	# SafeSign too. A reader whose name has this text is never opened.
	ignored_readers = "StarSign";
	# Certificates and the other public files of a card are kept on disk
	# ($XDG_CACHE_HOME/opensc, in Tessera's own folder) and read from there
	# the next time: an ePass2003 with five certificates took 19 s to read,
	# 3 s from the cache. Keys and PINs are never cached. If a card's
	# contents were changed elsewhere and Tessera shows the old ones,
	# delete that folder.
	framework pkcs15 {
		use_file_caching = public;
	}
	card_drivers = skeid, dtrust, cardos, gemsafeV1, starcos, tcos,
		oberthur, authentic, iasecc, belpic, entersafe, epass2003,
		rutoken, rutoken_ecp, myeid, dnie, masktech,
		esteid2018, esteid2025, coolkey, muscle, sc-hsm, setcos,
		PIV-II, cac, itacns, isoApplet, gids, openpgp, jpki, npa,
		cac1, nqapplet;
}
