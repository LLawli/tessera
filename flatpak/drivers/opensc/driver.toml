name = "OpenSC"
vendor = "OpenSC Project"
description = "Open-source driver: Feitian ePass2003 in the free format (formatted by OpenSC), PIV cards and YubiKeys, OpenPGP cards, CardOS, IDPrime and many others"
# Built into Tessera, not downloaded: under /app/lib in Tessera's own
# Flatpak, under /app/extra/tessera/lib in FlatPark's package. The path is
# relative to this folder, so it holds in both.
module = "../../../opensc-pkcs11.so"
# A card can take long to read the first time (an ePass2003 with five
# certificates: 19 s); after that its public files come from the cache.
patient = true
# One process for every app (src/shared.rs): with a process per connection,
# Firefox, the window's listings and `tessera status` each opened the card
# anew and waited for each other (six at once with an ePass2003; Firefox
# hung and the listing ran out of time).
shared = true

[env]
# Tessera's own configuration (next to this file), the same in both
# packages: OpenSC's defaults.
OPENSC_CONF = "./opensc.conf"
# OpenSC says its RSA mechanisms sign, verify and decrypt but do not
# encrypt, and Java (PJeOffice) drops a mechanism reported so, signing
# included: Tessera adds the encrypt flag to what it reports
# (src/mechflags.rs).
TESSERA_ENCRYPT_FLAG = "1"

# SafeNet's driver serves IDPrime cards and the eToken 5110 too. While it is
# switched on, OpenSC leaves those cards to it (every card driver but
# idprime), so each token shows once. With SafeNet off, OpenSC serves them.
[when_on.safenet.env]
OPENSC_CONF = "./opensc-without-idprime.conf"
